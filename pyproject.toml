[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace"
version = "0.1.0"
description = "Online-Marktplatz Praktikum des Moduls Algorithmik"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osmnx>=1.9.0",
    "scikit-learn>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
